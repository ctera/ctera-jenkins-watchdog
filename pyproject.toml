[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jenkins-watchdog"
version = "2.0.0"
description = "Autonomous Jenkins agent monitor — detects issues on k3s worker nodes, investigates root causes with Claude tool-use, recommends fixes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "litellm>=1.55.0",
    "orjson>=3.10.0",
    "valkey[libvalkey]>=6.0.0",
    "kubernetes>=31.0.0",
    "sse-starlette>=2.0.0",
    "python-jenkins>=1.8.0",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30.0,<1",
    "alembic>=1.14.0,<2",
    "PyYAML>=6.0.2,<7",
    "aiosmtplib>=5.1.1,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-PyYAML>=6.0.12",
    "aiosqlite>=0.20.0",
]

[project.scripts]
jenkins-watchdog = "jenkins_watchdog.entrypoints.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["jenkins_watchdog.domain", "jenkins_watchdog.application"]
mypy_path = "src"

[tool.coverage.run]
branch = true
source = ["jenkins_watchdog"]

[tool.coverage.report]
show_missing = true
skip_covered = true
