[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jenkins-watchdog"
version = "0.2.0"
description = "Autonomous Jenkins agent monitor — detects issues on k3s worker nodes, investigates root causes with Claude tool-use, recommends fixes"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    # Ships the `claude` CLI binary inside the wheel (claude_agent_sdk/_bundled/claude),
    # which the SDK prefers over $PATH. So this pin fixes BOTH the SDK and the CLI every
    # investigation runs on — review it deliberately on each bump, because a CLI change is
    # a behaviour change, not a dependency chore. An sdist carries no binary; the Dockerfile
    # asserts `--version` at build time so that case fails the build, not production.
    "claude-agent-sdk==0.2.139",
    "orjson>=3.10.0",
    "valkey[libvalkey]>=6.0.0",
    "kubernetes>=31.0.0",
    "sse-starlette>=2.0.0",
    "python-jenkins>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
