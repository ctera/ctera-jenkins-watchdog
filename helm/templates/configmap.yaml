apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "jenkins-watchdog.fullname" . }}-config
  labels:
    {{- include "jenkins-watchdog.labels" . | nindent 4 }}
data:
  WATCHDOG_PORT: {{ .Values.config.port | quote }}
  WATCHDOG_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  WATCHDOG_JENKINS_URL: {{ .Values.config.jenkinsUrl | quote }}
  WATCHDOG_JENKINS_USER: {{ .Values.config.jenkinsUser | quote }}
  WATCHDOG_JENKINS_AGENT_LABEL: {{ .Values.config.jenkinsAgentLabel | quote }}
  WATCHDOG_JENKINS_NAMESPACE: {{ .Values.config.jenkinsNamespace | quote }}
  WATCHDOG_JENKINS_FAILED_BUILD_WINDOW_HOURS: {{ .Values.config.jenkinsFailedBuildWindowHours | quote }}
  WATCHDOG_JENKINS_FAILED_BUILD_CHECK_TIMEOUT_S: {{ .Values.config.jenkinsFailedBuildCheckTimeoutSeconds | quote }}
  WATCHDOG_JENKINS_MONITOR_ENABLED: {{ .Values.config.jenkinsMonitorEnabled | quote }}
  WATCHDOG_JENKINS_SYNC_INTERVAL_S: {{ .Values.config.jenkinsSyncIntervalSeconds | quote }}
  WATCHDOG_JENKINS_SYNC_WINDOW_HOURS: {{ .Values.config.jenkinsSyncWindowHours | quote }}
  WATCHDOG_JENKINS_SYNC_CONCURRENCY: {{ .Values.config.jenkinsSyncConcurrency | quote }}
  WATCHDOG_JENKINS_SYNC_ENRICHMENT_LIMIT: {{ .Values.config.jenkinsSyncEnrichmentLimit | quote }}
  WATCHDOG_JENKINS_SYNC_LOG_LIMIT: {{ .Values.config.jenkinsSyncLogLimit | quote }}
  WATCHDOG_JENKINS_SOURCE_ATTRIBUTION_LIMIT: {{ .Values.config.jenkinsSourceAttributionLimit | quote }}
  WATCHDOG_JENKINS_SOURCE_PROFILES_PATH: {{ .Values.config.jenkinsSourceProfilesPath | quote }}
  WATCHDOG_AUTOMATIC_INVESTIGATIONS_ENABLED: {{ .Values.config.automaticInvestigationsEnabled | quote }}
  WATCHDOG_AUTOMATIC_INVESTIGATION_MIN_PRIORITY: {{ .Values.config.automaticInvestigationMinPriority | quote }}
  WATCHDOG_AUTOMATIC_INVESTIGATION_BATCH_SIZE: {{ .Values.config.automaticInvestigationBatchSize | quote }}
  WATCHDOG_PROMETHEUS_ENDPOINT: {{ .Values.config.prometheusEndpoint | quote }}
  WATCHDOG_PROMETHEUS_ENABLED: {{ .Values.config.prometheusEnabled | quote }}
  WATCHDOG_VALKEY_HOST: {{ .Values.config.valkeyHost | quote }}
  WATCHDOG_VALKEY_PORT: {{ .Values.config.valkeyPort | quote }}
  WATCHDOG_VALKEY_SSL: {{ .Values.config.valkeySsl | quote }}
  WATCHDOG_DATABASE_HOST: {{ default (printf "%s-postgresql" .Release.Name) .Values.config.databaseHost | quote }}
  WATCHDOG_DATABASE_PORT: {{ .Values.config.databasePort | quote }}
  WATCHDOG_DATABASE_USER: {{ .Values.config.databaseUser | quote }}
  WATCHDOG_DATABASE_NAME: {{ .Values.config.databaseName | quote }}
  WATCHDOG_ROUTING_CONFIG_PATH: {{ .Values.config.routingConfigPath | quote }}
  WATCHDOG_AUTOMATION_TEMPLATES_PATH: {{ .Values.config.automationTemplatesPath | quote }}
  WATCHDOG_LLM_MODEL: {{ .Values.config.llmModel | quote }}
  WATCHDOG_LLM_FALLBACK_MODELS: {{ .Values.config.llmFallbackModels | quote }}
  WATCHDOG_LLM_TEMPERATURE: {{ .Values.config.llmTemperature | quote }}
  WATCHDOG_LLM_MAX_TOKENS: {{ .Values.config.llmMaxTokens | quote }}
  WATCHDOG_LLM_MAX_RETRIES: {{ .Values.config.llmMaxRetries | quote }}
  WATCHDOG_LLM_SCAN_TOKEN_BUDGET: {{ .Values.config.llmScanTokenBudget | quote }}
  WATCHDOG_LLM_DEEP_SCAN_TOKEN_BUDGET: {{ .Values.config.llmDeepScanTokenBudget | quote }}
  WATCHDOG_LLM_DAILY_TOKEN_BUDGET: {{ .Values.config.llmDailyTokenBudget | quote }}
  WATCHDOG_LLM_MANUAL_TOKEN_RESERVE: {{ .Values.config.llmManualTokenReserve | quote }}
  WATCHDOG_LLM_DAILY_COST_BUDGET_USD: {{ .Values.config.llmDailyCostBudgetUsd | quote }}
  WATCHDOG_LLM_MANUAL_COST_RESERVE_USD: {{ .Values.config.llmManualCostReserveUsd | quote }}
  WATCHDOG_LLM_MAX_TOKEN_COST_USD_PER_MILLION: {{ .Values.config.llmMaxTokenCostUsdPerMillion | quote }}
  WATCHDOG_LLM_TRIAGE_BATCH_SIZE: {{ .Values.config.llmTriageBatchSize | quote }}
  WATCHDOG_LLM_TRIAGE_TOKEN_BUDGET: {{ .Values.config.llmTriageTokenBudget | quote }}
  WATCHDOG_MAX_TOOL_ROUNDS: {{ .Values.config.maxToolRounds | quote }}
  WATCHDOG_MAX_DEEP_TOOL_ROUNDS: {{ .Values.config.maxDeepToolRounds | quote }}
  WATCHDOG_MAX_INVESTIGATIONS_PER_SCAN: {{ .Values.config.maxInvestigationsPerScan | quote }}
  WATCHDOG_MAX_DEEP_INVESTIGATIONS_PER_SCAN: {{ .Values.config.maxDeepInvestigationsPerScan | quote }}
  WATCHDOG_INVESTIGATION_WORKER_LEASE_SECONDS: {{ .Values.config.investigationWorkerLeaseSeconds | quote }}
  WATCHDOG_INVESTIGATION_MAX_ATTEMPTS: {{ .Values.config.investigationMaxAttempts | quote }}
  WATCHDOG_OIDC_ISSUER: {{ .Values.config.oidcIssuer | quote }}
  WATCHDOG_OIDC_CLIENT_ID: {{ .Values.config.oidcClientId | quote }}
  WATCHDOG_OIDC_REDIRECT_URI: {{ .Values.config.oidcRedirectUri | quote }}
  WATCHDOG_OIDC_ALLOWED_GROUPS: {{ .Values.config.oidcAllowedGroups | quote }}
  WATCHDOG_JIRA_BASE_URL: {{ .Values.config.jiraBaseUrl | quote }}
  WATCHDOG_JIRA_USER_EMAIL: {{ .Values.config.jiraUserEmail | quote }}
  WATCHDOG_JIRA_PROJECTS: {{ .Values.config.jiraProjects | quote }}
  WATCHDOG_JIRA_ENABLED: {{ .Values.config.jiraEnabled | quote }}
  WATCHDOG_GITHUB_ENABLED: {{ .Values.config.githubEnabled | quote }}
  WATCHDOG_GITHUB_API_URL: {{ .Values.config.githubApiUrl | quote }}
  WATCHDOG_GITLAB_ENABLED: {{ .Values.config.gitlabEnabled | quote }}
  WATCHDOG_GITLAB_API_URL: {{ .Values.config.gitlabApiUrl | quote }}
  WATCHDOG_EMAIL_ENABLED: {{ .Values.config.emailEnabled | quote }}
  WATCHDOG_SMTP_HOST: {{ .Values.config.smtpHost | quote }}
  WATCHDOG_SMTP_PORT: {{ .Values.config.smtpPort | quote }}
  WATCHDOG_SMTP_START_TLS: {{ .Values.config.smtpStartTls | quote }}
  WATCHDOG_SMTP_USERNAME: {{ .Values.config.smtpUsername | quote }}
  WATCHDOG_EMAIL_FROM: {{ .Values.config.emailFrom | quote }}
