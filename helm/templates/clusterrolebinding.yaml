apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "jenkins-watchdog.fullname" . }}-reader
  labels:
    {{- include "jenkins-watchdog.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "jenkins-watchdog.fullname" . }}-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "jenkins-watchdog.fullname" . }}
    namespace: {{ .Release.Namespace }}
