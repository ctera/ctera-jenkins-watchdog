apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "jenkins-watchdog.fullname" . }}-migrate
  labels:
    {{- include "jenkins-watchdog.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "jenkins-watchdog.componentSelectorLabels" (dict "root" . "component" "migration") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "jenkins_watchdog", "migrate"]
          envFrom:
            {{- include "jenkins-watchdog.envFrom" . | nindent 12 }}
          env:
            {{- include "jenkins-watchdog.databasePasswordEnv" . | nindent 12 }}
