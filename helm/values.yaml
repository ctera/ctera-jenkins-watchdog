image:
  repository: cteraacrdevops.azurecr.io/jenkins-watchdog
  tag: 2.0.0-1569a28
  pullPolicy: Always

imagePullSecrets:
  - name: acr-credentials

replicas: 1
workerReplicas: 1
revisionHistoryLimit: 2

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi

workerResources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 768Mi

config:
  port: "8000"
  logLevel: info
  jenkinsUrl: "https://jenkins.ctera.dev"
  jenkinsUser: ""
  jenkinsAgentLabel: ""
  jenkinsNamespace: "jenkins"
  jenkinsFailedBuildWindowHours: "4"
  jenkinsFailedBuildCheckTimeoutSeconds: "120"
  jenkinsMonitorEnabled: "true"
  jenkinsSyncIntervalSeconds: "300"
  jenkinsSyncWindowHours: "168"
  jenkinsSyncConcurrency: "10"
  jenkinsSyncEnrichmentLimit: "250"
  jenkinsSyncLogLimit: "30"
  jenkinsSourceAttributionLimit: "500"
  jenkinsSourceProfilesPath: /app/config/source-profiles.yaml
  automaticInvestigationsEnabled: "true"
  automaticInvestigationMinPriority: "1"
  automaticInvestigationBatchSize: "250"
  prometheusEndpoint: "http://prometheus.monitoring.svc.cluster.local:9090"
  prometheusEnabled: "false"
  valkeyHost: "valkey-primary.valkey.svc.cluster.local"
  valkeyPort: "6379"
  valkeySsl: "false"
  databaseHost: ""
  databasePort: "5432"
  databaseUser: watchdog
  databaseName: watchdog
  routingConfigPath: /app/config/routing.yaml
  automationTemplatesPath: /app/templates/automation
  llmModel: "anthropic/claude-sonnet-4-6"
  llmFallbackModels: "anthropic/claude-opus-4-6"
  llmTemperature: "0.1"
  llmMaxTokens: "4096"
  llmMaxRetries: "2"
  llmScanTokenBudget: "40000"
  llmDeepScanTokenBudget: "64000"
  llmDailyTokenBudget: "4000000"
  llmManualTokenReserve: "1000000"
  llmDailyCostBudgetUsd: "14.00"
  llmManualCostReserveUsd: "3.50"
  llmMaxTokenCostUsdPerMillion: "25.00"
  llmTriageBatchSize: "50"
  llmTriageTokenBudget: "8000"
  maxToolRounds: "10"
  maxDeepToolRounds: "25"
  maxInvestigationsPerScan: "12"
  maxDeepInvestigationsPerScan: "20"
  investigationWorkerLeaseSeconds: "600"
  investigationMaxAttempts: "3"
  oidcIssuer: ""
  oidcClientId: "jenkins-watchdog"
  oidcRedirectUri: ""
  oidcAllowedGroups: "DevOps Team"
  jiraBaseUrl: "https://cteranet.atlassian.net"
  jiraUserEmail: ""
  jiraProjects: "CI"
  jiraEnabled: "false"
  githubEnabled: "false"
  githubApiUrl: "https://api.github.com"
  gitlabEnabled: "false"
  gitlabApiUrl: "https://gitlab.com/api/v4"
  emailEnabled: "false"
  smtpHost: mailpit
  smtpPort: "1025"
  smtpStartTls: "false"
  smtpUsername: ""
  emailFrom: jenkins-watchdog@localhost

migration:
  backoffLimit: 3

schedules:
  enabled: true
  timeZone: Asia/Jerusalem
  regular: "*/30 * * * *"
  deep: "0 2 * * *"

postgresql:
  enabled: true
  auth:
    username: watchdog
    database: watchdog
    existingSecret: ""
    secretKeys:
      userPasswordKey: password
  primary:
    persistence:
      enabled: true
      size: 8Gi

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  host: jenkins-watchdog.platform.ctera.com
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: jenkins-watchdog-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/service.nativelb: "true"

healthCheck:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 30
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10

pdb:
  enabled: true
  minAvailable: 1

reloader:
  enabled: false

externalSecrets:
  enabled: false
  secretStoreName: ""
  secretStoreKind: ClusterSecretStore
  anthropicApiKey: ""
  jenkinsToken: ""
  oidcClientSecret: ""
  jiraApiToken: ""
  githubToken: ""
  gitlabToken: ""
  smtpUsername: ""
  smtpPassword: ""
