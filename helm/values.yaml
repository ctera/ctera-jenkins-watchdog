image:
  repository: cteraacrdevops.azurecr.io/jenkins-watchdog
  tag: 0.2.0-699edc5
  pullPolicy: Always

imagePullSecrets:
  - name: acr-credentials

replicas: 1
revisionHistoryLimit: 2

resources:
  requests:
    memory: 512Mi
    cpu: 100m
  limits:
    # Raised from 1Gi: this deployment had already been OOMKilled hundreds of times at
    # that limit, and each investigation now also spawns a Claude Code subprocess.
    # llmMaxConcurrentAgents bounds how many run at once.
    memory: 3Gi

config:
  port: "8000"
  logLevel: info
  jenkinsUrl: "https://jenkins.ctera.dev"
  jenkinsUser: ""
  jenkinsAgentLabel: ""
  jenkinsNamespace: "jenkins"
  jenkinsFailedBuildWindowHours: "4"
  prometheusEndpoint: "https://prometheus.ctera.dev"
  prometheusEnabled: "true"
  valkeyHost: "valkey-primary.valkey.svc.cluster.local"
  valkeyPort: "6379"
  valkeySsl: "false"
  # Bare model ids — the litellm "anthropic/" provider prefix is not a thing the
  # Claude Code CLI accepts.
  llmModel: "claude-sonnet-5"
  llmFallbackModel: "claude-opus-5"
  # Every agent call is a CLI subprocess of a few hundred MB, so this is the real memory
  # bound on a scan, not a politeness knob. Raise it only alongside resources.limits.
  llmMaxConcurrentAgents: "2"
  llmAgentIdleTimeoutS: "180"
  promptsDir: "/app/prompts"
  maxToolRounds: "15"
  maxInvestigationsPerScan: "12"
  oidcIssuer: ""
  oidcClientId: "jenkins-watchdog"
  oidcRedirectUri: ""
  oidcAllowedGroups: "DevOps Team"
  jiraBaseUrl: "https://cteranet.atlassian.net"
  jiraUserEmail: ""
  jiraProjects: "CI"
  schedulerEnabled: "true"
  schedulerScanIntervalMinutes: "60"
  schedulerDeepScanIntervalMinutes: "1440"
  autoJiraEnabled: "false"
  autoJiraProject: "CI"
  autoJiraAssigneeEmail: "keynan.levi@ctera.com"
  autoJiraSeverityThreshold: "critical"

# Writable $HOME for the Claude Code CLI's session state. See deployment.yaml.
agentHome:
  sizeLimit: 512Mi

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

ingress:
  enabled: true
  host: pipelines-guardian.platform.ctera.com
  path: /
  pathType: Prefix
  tls:
    enabled: true
    secretName: pipelines-guardian-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/service.nativelb: "true"

healthCheck:
  liveness:
    path: /health
    initialDelaySeconds: 10
    periodSeconds: 30
  readiness:
    path: /ready
    initialDelaySeconds: 5
    periodSeconds: 10

pdb:
  enabled: true
  minAvailable: 1

reloader:
  enabled: false

externalSecrets:
  enabled: false
  secretStoreName: ""
  secretStoreKind: ClusterSecretStore
  claudeCodeOauthToken: ""
  jenkinsToken: ""
  oidcClientSecret: ""
  jiraApiToken: ""
